<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
        <title>Nook Desktop</title>
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/weather.css" />
        <link rel="stylesheet" href="css/kk.css" />
        <script>if (typeof module === 'object') {window.module = module; module = undefined;}</script>
        <script src="js/jquery-3.6.1.min.js" type="text/javascript"></script>
        <script src="js/nanobar.min.js" type="text/javascript"></script>
        <script>if (window.module) module = window.module;</script>
        <script src="js/main.js" defer="" type="text/javascript"></script>
    </head>
    <body>
    <div class="container overlay">
      <div class="error"><div></div></div>
      <div class="header">
          <span class="title"><span id="openGithub" role="link" data-i18n-title="Nook GitHub">nook</span> |
              <button id="settings" data-page="settings" data-i18n-title="Settings" role="link">&#xf013;</button>
              <button id="home" class="hidden" data-page="home" data-i18n-title="Home" role="link">&#xf015;</button>
              <button id="pause" data-i18n-title="Pause" data-i18n-title-alt="Play">&#xf04c;</button>
          </span>
          <div class="buttonbox">
              <button id="close" data-i18n-title="Minimize to tray">&#xf068;</button>
              <button id="exit" data-i18n-title="Exit Nook">&#xf00d;</button>
          </div>
      </div>
      <div class="main">
          <div class="home page">
              <div class="controls">
                  <label>
                      <span data-i18n="Music Volume"></span>
                      <input id="music" type="range" step="1" min="0" max="100" />
                  </label>
                  <label>
                      <span data-i18n="Rain Volume"></span>
                      <input id="rain" type="range" step="1" min="0" max="100" />
                  </label>
              </div>
              <div class="game-select">
                  <select id="gameSelect">
                      <option value="population-growing" data-i18n="AC: Population Growing (GC)"></option>
                      <option value="population-growing-snowy" data-i18n="AC: Population Growing (GC) [Snowy]"></option>
                      <option value="population-growing-cherry" data-i18n="AC: Population Growing (GC) [Sakura]"></option>
                      <option value="population-growing-rainy" data-i18n="AC: Population Growing (GC) [Rainy Day]"></option>
                      <option value="wild-world" data-i18n="AC: City Folk (Wii)"></option>
                      <option value="wild-world-rainy" data-i18n="AC: City Folk (Wii) [Rainy]"></option>
                      <option value="wild-world-snowy" data-i18n="AC: City Folk (Wii) [Snowy]"></option>
                      <option value="new-leaf" selected data-i18n="AC: New Leaf (3DS)"></option>
                      <option value="new-leaf-rainy" data-i18n="AC: New Leaf (3DS) [Rainy]"></option>
                      <option value="new-leaf-snowy" data-i18n="AC: New Leaf (3DS) [Snowy]"></option>
                      <option value="new-horizons" data-i18n="AC: New Horizons (Switch)"></option>
                      <option value="new-horizons-rainy" data-i18n="AC: New Horizons (Switch) [Rainy]"></option>
                      <option value="new-horizons-snowy" data-i18n="AC: New Horizons (Switch) [Snowy]"></option>
                      <option value="pocket-camp" data-i18n="AC: Pocket Camp (Mobile)"></option>
                      <optgroup label="&nbsp;"></optgroup>
                      <option value="kk-slider-desktop" data-i18n="K.K. Slider"></option>
                      <option value="random" data-i18n="Random"></option>
                  </select>
              </div>
              <div id="nowPlaying" class="now-playing hidden">
                  <span class="np-note">&#9834;</span>
                  <span class="np-game"></span><span class="np-sep"> &middot; </span><span class="np-track"></span>
              </div>
              <div id="kkScene" class="kk-scene hidden" aria-live="polite">
                  <svg viewBox="0 0 240 130" role="img" aria-label="K.K. Slider">
                      <defs>
                          <radialGradient id="kkSpot" cx="50%" cy="100%" r="70%">
                              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
                              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                          </radialGradient>
                      </defs>
                      <ellipse cx="120" cy="112" rx="95" ry="60" fill="url(#kkSpot)" />
                      <ellipse cx="120" cy="118" rx="80" ry="8" fill="#ffffff" fill-opacity="0.08" />
                      <text class="kk-note n1" x="150" y="70">&#9834;</text>
                      <text class="kk-note n2" x="166" y="86">&#9835;</text>
                      <text class="kk-note n3" x="140" y="56">&#9834;</text>
                      <g class="kk-body">
                          <rect x="103" y="95" width="34" height="8" rx="4" fill="#5b3a86" />
                          <ellipse class="kk-fur" cx="106" cy="107" rx="15" ry="7" />
                          <ellipse class="kk-fur" cx="134" cy="107" rx="15" ry="7" />
                          <rect class="kk-fur" x="100" y="64" width="40" height="44" rx="18" />
                          <g class="kk-head">
                              <path class="kk-fur" d="M104 32 C 84 30, 74 60, 84 86 C 89 96, 102 92, 103 78 Z" />
                              <path class="kk-fur" d="M136 32 C 156 30, 166 60, 156 86 C 151 96, 138 92, 137 78 Z" />
                              <ellipse class="kk-fur" cx="120" cy="46" rx="25" ry="23" />
                              <ellipse cx="120" cy="58" rx="12" ry="8" fill="#fbf9f2" stroke="#cfc8b3" stroke-width="1.2" />
                              <path d="M103 37 q8 -7 16 -1" class="kk-ink" stroke-width="4.5" />
                              <path d="M121 36 q8 -6 16 1" class="kk-ink" stroke-width="4.5" />
                              <path d="M107 47 q5 -5 10 0" class="kk-ink" stroke-width="2.2" />
                              <path d="M123 47 q5 -5 10 0" class="kk-ink" stroke-width="2.2" />
                              <ellipse cx="120" cy="55" rx="4.5" ry="3.2" fill="#1b1b1b" />
                              <path class="kk-ink kk-mouth" d="M114 61 q6 5 12 0" stroke-width="1.6" />
                          </g>
                          <g class="kk-guitar">
                              <line x1="118" y1="82" x2="80" y2="58" stroke="#4e3119" stroke-width="7" stroke-linecap="round" />
                              <ellipse cx="78" cy="56" rx="7" ry="4.5" fill="#3a2110" transform="rotate(32 78 56)" />
                              <ellipse cx="128" cy="78" rx="15" ry="11" fill="#c47a3d" stroke="#7a4a1e" stroke-width="1.5" />
                              <ellipse cx="129" cy="91" rx="20" ry="15" fill="#c47a3d" stroke="#7a4a1e" stroke-width="1.5" />
                              <circle cx="127" cy="85" r="5.5" fill="#3a2110" />
                              <rect x="124" y="95" width="14" height="3" rx="1.5" fill="#3a2110" />
                              <g stroke="#f2e4bd" stroke-width="0.7">
                                  <line x1="130" y1="96" x2="82" y2="58" />
                                  <line x1="131" y1="94" x2="84" y2="56" />
                                  <line x1="129" y1="98" x2="80" y2="60" />
                              </g>
                          </g>
                          <path d="M103 72 q-12 2 -14 -10" class="kk-arm-line" />
                          <circle cx="89" cy="61" r="4.8" class="kk-fur" />
                          <g class="kk-arm">
                              <path d="M138 72 q8 10 -4 18" class="kk-arm-line" />
                              <circle cx="133" cy="90" r="4.8" class="kk-fur" />
                          </g>
                      </g>
                  </svg>
                  <div class="kk-caption">
                      <span class="kk-title" data-i18n="K.K. is in the house!"></span>
                      <span class="kk-song"></span>
                      <button id="skipKK" class="kk-skip" data-i18n="next song" data-i18n-title="Skip to another K.K. song"></button>
                  </div>
              </div>
              <button id="weatherStrip" class="weather-strip" data-page="weather" data-i18n-title="Weather report">
                  <span class="strip-icon"></span>
                  <span class="strip-temp"></span>
                  <span class="strip-text" data-i18n="realtime weather is off"></span>
              </button>
              <div class="bottom-support">
                <button id="patreon" data-page="patreon" data-i18n="patreon" data-i18n-title="Patreon list and support links"></button>
                <button id="changelog" data-page="changelog" data-i18n="changelog" data-i18n-title="changelog"></button>
              </div>
          </div>
          <div class="settings page hidden">
              <p data-i18n="player settings" role="heading" aria-level="1"></p>
              <label>
                  <input id="grandFather" type="checkbox"/>
                  <span data-i18n="Grandfather clock mode"></span> <span class="tiny" data-i18n="(plays once, no loop)"></span>
              </label>
              <label>
                  <input class="rains" id="gameRain" type="checkbox"/>
                  <span data-i18n="Use game rain sound"></span>
              </label>
              <label>
                  <input class="rains" id="peacefulRain" type="checkbox"/>
                  <span data-i18n="Use no-thunder rain sound"></span>
              </label>
              <label>
                  <input id="useRealtimeWeather" type="checkbox"/>
                  <span data-i18n="Use realtime weather"></span> <span class="tiny" data-i18n="(matches music and rain to your local weather)"></span>
              </label>
              <label class="api-label">
                  <span data-i18n="Weather api code"></span>
                  <button id="getApiKey" class="tiny-link" data-i18n="(get a free key)" data-i18n-title="Opens weatherapi.com"></button>
                  <input id="weatherApiCode" type="password" autocomplete="off" />
              </label>
              <label>
                  <input id="preferNoDownload" type="checkbox"/>
                  <span data-i18n="Don't download music"></span> <span class="tiny" data-i18n="(saves space, but no offline)"></span>
              </label>
              <div class="towntune-setting">
                <label>
                    <input id="townTune" type="checkbox"/>
                    <span data-i18n="Enable town tune"></span>
                </label>
              </div>
              <label class="kk-label">
                <input id="kkSaturday" type="checkbox"/>
                <span data-i18n="Play K.K. music on Saturday nights"></span>
              </label>
              <label>
                  <input id="openOnStartup" type="checkbox"/>
                  <span data-i18n="Open on startup"></span>
              </label>
              <div class="btnContainer">
                <button id="kkCustomize" data-page="kk-customize" data-i18n="customize k.k. playlist"></button>
                <button class="towntune-custom" id="towntune_customize" data-page="tune-settings" data-i18n="customize town tune"></button>
              </div>
              <label class="lang-label">
                <p data-i18n="language"></p>
                  <select id="langSelect">
                    <option value="en">English (US)</option>
                    <option value="es">Spanish/Español (ES)</option>
                    <option value="de">German/Deutsch (DE)</option>
                    <option value="it">Italian/Italiano (IT)</option>
                    <option value="fr">French/Français (FR)</option>
                    <option value="cn">Chinese/中文 (CN)</option>
                  </select>
              </label>
              <p class="offline" data-i18n="offline" role="heading" aria-level="2"></p>
              <span class="offlineCount" data-i18n="{{offlineFiles}}/{{totalFiles}} offline hourly music files downloaded"></span>
              <span class="offlineCount" data-i18n="{{offlineKKFiles}}/{{totalKKFiles}} offline k.k. music files downloaded"></span>
              <div class="btnContainer">
                <button class="download" id="downloadHourly" data-i18n="download all hourly music" data-i18n-alt="downloading..."></button>
                <button class="download" id="downloadKK" data-i18n="download all k.k. music" data-i18n-alt="downloading..."></button>
              </div>
              <div class="btnContainer">
                  <button id="clearSettings" data-i18n="clear local files and settings"></button>
              </div>
          </div>
          <div class="weather page hidden">
              <div class="weather-head">
                  <p data-i18n="weather" role="heading" aria-level="1"></p>
                  <div class="weather-tools">
                      <span class="unit-toggle" role="group">
                          <button data-unit="c">&deg;C</button><button data-unit="f">&deg;F</button>
                      </span>
                      <button id="weatherRefresh" data-i18n-title="refresh">&#xf021;</button>
                  </div>
              </div>
              <div class="weather-off">
                  <p class="weather-off-text"></p>
                  <button class="weather-off-btn" data-page="settings" data-i18n="open settings"></button>
              </div>
              <div class="weather-body hidden">
                  <div class="weather-now">
                      <div class="now-icon"></div>
                      <div class="now-text">
                          <div class="now-temp"></div>
                          <div class="now-cond"></div>
                          <div class="now-loc"></div>
                      </div>
                  </div>
                  <div class="weather-music"><span class="np-note">&#9834;</span> <span class="weather-music-text"></span></div>
                  <div class="weather-details"></div>
                  <p class="subhead" data-i18n="next hours"></p>
                  <div class="weather-hours"></div>
                  <p class="subhead" data-i18n="3-day forecast"></p>
                  <div class="weather-days"></div>
                  <div class="weather-updated"></div>
              </div>
          </div>
          <div class="kk-customize page hidden">
              <p data-i18n="k.k. playlist" role="heading" aria-level="1"></p>
              <div class="kk-btn btnContainer">
                <button id="save_kk" data-i18n="save" data-i18n-alt="saved!"></button>
                <button id="check_kk" data-i18n="check all"></button>
                <button id="uncheck_kk" data-i18n="uncheck all"></button>
                <button id="radio_kk" data-i18n="radio only"></button>
                <button id="live_kk" data-i18n="live only"></button>
              </div>
              <div class="playlist"></div>
          </div>
          <div class="tune-settings page hidden">
              <p data-i18n="tune settings" role="heading" aria-level="1"></p>
              <div class="creator">
                <div class="inputs"></div>
              </div>
              <div class="tips">
                <p data-i18n="tip: you can use the mouse wheel to adjust notes!"></p>
              </div>
              <div class="save-tune-btn btnContainer">
                <button id="save_tune" data-i18n="save" data-i18n-alt="saved!"></button>
                <button id="play_tune" data-i18n="play" data-i18n-alt="playing..."></button>
              </div>
          </div>
          <div class="patreon page hidden">
              <div class="head">
                  <p data-i18n="patreon supporters" role="heading" aria-level="1"></p>
                  <button id="supportme" data-i18n="(support me!)" data-i18n-title="Opens developer's Patreon page"></button>
              </div>
              <div class="supporters">
                  <div class="gold">
                      <p data-i18n="gold supporters" role="heading" aria-level="2"></p>
                      <ul></ul>
                  </div>
                  <div class="silver">
                      <p data-i18n="silver supporters" role="heading" aria-level="2"></p>
                      <ul></ul>
                  </div>
                  <div class="bronze">
                      <p data-i18n="bronze supporters" role="heading" aria-level="2"></p>
                      <ul></ul>
                  </div>
              </div>
          </div>
          <div class="changelog page hidden">
              <p data-i18n="changelog" role="heading" aria-level="1"></p>
              <div class="log"></div>
          </div>
      </div>
    </div>
    </body>
</html>
